name: iOS Build

on:
  push:
    branches:
      - main
      - phase-1-connectivity-diagnostics
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build RideDash for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project RideDash.xcodeproj \
            -target RideDash \
            -configuration Debug \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO \
            build | xcpretty
