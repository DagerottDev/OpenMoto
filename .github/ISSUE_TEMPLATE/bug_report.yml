name: Bug report
description: Report a reproducible app or display problem during testing.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        RideDash is in testing. Search existing issues first. Use sample data; remove passwords, SSIDs, keys, registrations and personal routes from attachments. Do not post security vulnerabilities publicly.
  - type: input
    id: version
    attributes:
      label: Commit SHA and Xcode version
      placeholder: "git rev-parse --short HEAD; Xcode version"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: iPhone model and iOS version (or Simulator)
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Build or installation
        - Navigation or route sharing
        - Garage, fuel or maintenance
        - Expenses or CSV export
        - Ride records
        - Wi-Fi or authentication
        - Projection or controls
        - Settings, privacy or accessibility
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open ...
2. Tap ...
3. Observe ..."
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: hardware
    attributes:
      label: Display details (if applicable)
      description: Firmware, manual-test stage, protocol settings, and whether Stop Projection/Disconnect restored the normal display. Omit passwords and raw SSIDs.
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized logs or screenshots
      description: Review every attachment and remove personal information before uploading.
  - type: checkboxes
    id: review
    attributes:
      label: Before submitting
      options:
        - label: I removed credentials, key material and personal information from this report and its attachments.
          required: true
